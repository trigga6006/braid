[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "braid"
version = "0.5.0"
description = "Governed context synchronization for existing Claude Code, Codex, Hermes, and OpenClaw sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Braid contributors"}]
keywords = ["agents", "context", "codex", "claude", "a2a", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["cryptography==48.0.1"]

[project.urls]
Homepage = "https://github.com/trigga6006/braid"
Repository = "https://github.com/trigga6006/braid"
Issues = "https://github.com/trigga6006/braid/issues"

[project.scripts]
braid = "braid_cli:main"
braid-session = "braid_session:main"
braid-ledger = "context_bridge:main"
braid-net = "network_bridge:main"
braid-hub = "team_hub:main"
braid-team = "team_connector:main"
braid-mcp = "context_mcp:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "braid_cli", "braid_session",
  "network_bridge", "context_adapters", "context_bridge",
  "context_autopolicy", "context_exchange", "context_handoff",
  "context_extract", "context_mcp", "context_model", "context_policy",
  "context_security", "context_store",
  "incident_workflow",
  "terminal_safe",
  "team_hub",
  "team_connector",
]
